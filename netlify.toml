# Header policy only. Build command and publish directory stay in the Netlify UI
# so this file does not change production deploy settings.

# Fingerprinted Next.js assets — already immutable in production; keep that contract.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public brand assets. Not HTML. Safe to cache at the CDN.
[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Booking API must never be cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private, no-store"
